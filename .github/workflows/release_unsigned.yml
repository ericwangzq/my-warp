name: Release (Unsigned)

on:
  push:
    tags:
      - 'v*'

jobs:
  build_and_release:
    name: Build and Release (macOS, unsigned)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt,clippy

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install cargo-bundle
        run: ./script/install_cargo_bundle

      - name: Install cargo-about
        run: cargo install cargo-about --features cli

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install protobuf
        run: |
          brew install protobuf
          echo "PROTOC=$(brew --prefix protobuf)/bin/protoc" >> "$GITHUB_ENV"

      - name: Verify protoc
        run: protoc --version

      - name: Build DMG (unsigned)
        run: ./script/bundle --channel oss --nosign --nouniversal

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release-lto/bundle/osx/WarpOss.dmg
          body: |
            ## 安装说明

            由于没有 Apple 开发者签名，安装后需要绕过 Gatekeeper：

            **方法一（推荐）**：右键点击 App → 选择「打开」

            **方法二**：终端运行
            ```bash
            xattr -rd com.apple.quarantine /Applications/WarpOss.app
            ```
